[clippy::all]
# Force warnings to be errors in CI
[clippy::pedantic]
# Allow some pedantic lints that are too strict for cryptographic code
allow = [
    "clippy::must_use",
    "clippy::missing_errors_doc",
    "clippy::cast_possible_truncation",
    "clippy::cast_lossless",
    "clippy::uninlined_format_args",
    "clippy::manual_let_else",
    "clippy::cast_sign_loss",
    "clippy::wildcard_imports",
    "clippy::multiple_inherent_impl",
    "clippy::similar_names",
    "clippy::too_many_arguments",
    "clippy::option_if_let_else",
    "clippy::needless_pass_by_value",
    "clippy::cast_precision_loss",
    "clippy::cast_possible_wrap",
    "clippy::cast_ptr_alignment",
    "clippy::cast_lossless",
    "clippy::cloned_instead_of_copied",
    "clippy::copy_iterator",
    "clippy::default_numeric_fallback",
    "clippy::diverging_sub_expression",
    "clippy::drop_copy",
    "clippy::drop_ref",
    "clippy::eq_op",
    "clippy::expl_impl_clone_on_copy",
    "clippy::extra_unused_lifetimes",
    "clippy::from_iter_instead_of_collect",
    "clippy::if_same_then_else",
    "clippy::if_then_some_else_none",
    "clippy::indexing_slicing",
    "clippy::inline_always",
    "clippy::large_stack_arrays",
    "clippy::let_underscore_must_use",
    "clippy::let_underscore_drop",
    "clippy::needless_borrow",
    "clippy::needless_borrowed_bool",
    "clippy::needless_clone",
    "clippy::needless_continue",
    "clippy::needless_pass_by_value",
    "clippy::needless_pass_by_value_mut",
    "clippy::needless_range_loop",
    "clippy::needless_return",
    "clippy::needless_update",
    "clippy::new_without_default",
    "clippy::non_ascii_literal",
    "clippy::not_unsafe_ptr_arg_deref",
    "clippy::pub_use_without_extern_crate",
    "clippy::redundant_clone",
    "clippy::redundant_else",
    "clippy::redundant_else_for_return",
    "clippy::redundant_feature_names",
    "clippy::redundant_feature_names",
    "clippy::redundant_closure_for_method_calls",
    "clippy::redundant_field_names",
    "clippy::redundant_round_trip",
    "clippy::redundant_selection",
    "clippy::redundant_static_lifetimes",
    "clippy::redundant_type_annotations",
    "clippy::rest_pat_in_fully_bound_structs",
    "clippy::semicolon_if_nothing_returned",
    "clippy::shadow_reuse",
    "clippy::shadow_repeat",
    "clippy::shadow_unrelated",
    "clippy::single_char_lifetime_names",
    "clippy::single_component_path_imports",
    "clippy::str_to_string",
    "clippy::string_add",
    "clippy::string_lit_as_bytes",
    "clippy::string_to_string",
    "clippy::superfluous_aliases",
    "clippy::to_clone",
    "clippy::trivially_copy_pass_by_ref",
    "clippy::trivially_copy_pass_by_ref",
    "clippy::unnecessary_self_imports",
    "clippy::unnecessary_self_imports",
    "clippy::unnecessary_self_imports",
    "clippy::unneeded_field_pattern",
    "clippy::unneeded_field_pattern",
    "clippy::unreadable_literal",
    "clippy::unused_self",
    "clippy::unused_unit",
    "clippy::use_debug",
    "clippy::use_debug",
    "clippy::use_self",
    "clippy::use_self",
    "clippy::use_self",
    "clippy::useless_conversion",
    "clippy::useless_conversion",
    "clippy::useless_format",
    "clippy::useless_format",
    "clippy::useless_let_if_seq",
    "clippy::useless_let_if_seq",
    "clippy::useless_transmute",
    "clippy::useless_transmute",
    "clippy::use_self",
    "clippy::use_self",
    "clippy::verbose_file_reads",
    "clippy::verbose_file_reads",
]

[clippy::perf]
# Performance lints are warnings, not errors
allow = [
    "clippy::needless_pass_by_value",
]

[clippy::correctness]
# Correctness lints are errors in CI
deny = [
    "clippy::all",
    "clippy::pedantic",
]

[clippy::complexity]
# Complexity lints
deny = [
    "clippy::all",
    "clippy::pedantic",
]

[clippy::style]
# Style lints
deny = [
    "clippy::all",
    "clippy::pedantic",
]

[clippy::suspicious]
# Suspicious lints
deny = [
    "clippy::all",
    "clippy::pedantic",
]

# Docker Compose for Atoll Block Explorer
# Deploys explorer frontend, backend API, and reverse proxy

version: "3.8"

services:
  # Block Explorer Frontend (React + Vite)
  explorer-frontend:
    build:
      context: ./explorer/frontend
      dockerfile: Dockerfile
    container_name: atoll-explorer-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_NODE_URL=http://localhost:8081
    depends_on:
      explorer-api:
        condition: service_healthy
    networks:
      - atoll-explorer

  # Block Explorer Backend API (Node.js + Express)
  explorer-api:
    build:
      context: ./explorer/backend
      dockerfile: Dockerfile
    container_name: atoll-explorer-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - RPC_URL=http://atoll-node:8081
      - WS_URL=ws://atoll-node:8082
      - DATABASE_URL=postgres://atoll_explorer:atoll_explorer@postgres:5432/atoll_explorer
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      atoll-node:
        condition: service_healthy
    networks:
      - atoll-explorer

  # PostgreSQL for indexed blockchain data
  postgres:
    image: postgres:15-alpine
    container_name: atoll-explorer-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=atoll_explorer
      - POSTGRES_PASSWORD=atoll_explorer
      - POSTGRES_DB=atoll_explorer
    volumes:
      - atoll-explorer-postgres-data:/var/lib/postgresql/data
    networks:
      - atoll-explorer

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: atoll-explorer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - atoll-explorer-redis-data:/data
    networks:
      - atoll-explorer

  # Reverse proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: atoll-explorer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-explorer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - explorer-frontend
      - explorer-api
    networks:
      - atoll-explorer

volumes:
  atoll-explorer-postgres-data:
  atoll-explorer-redis-data:

networks:
  atoll-explorer:
    driver: bridge

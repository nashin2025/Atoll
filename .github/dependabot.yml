version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "cargo"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
      include: "scope"
    groups:
      rust-crates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "rand"
        versions: [">= 0.8.5"]
      - dependency-name: "schnorrkel"
        versions: [">= 0.11.0"]
    allow:
      - dependency-name: "winterfell"
        update-types: ["minor", "patch"]
      - dependency-name: "schnorrkel"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/explorer/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
      include: "scope"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "vite"
          - "tailwindcss"

  - package-ecosystem: "npm"
    directory: "/wallet/gui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
      include: "scope"
    groups:
      tauri-ecosystem:
        patterns:
          - "@tauri-apps/api"
          - "@tauri-apps/cli"

name: "Rust CI"

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  CARGO_NET_RETRY: 10

jobs:
  # ============================================================================
  # LINT AND FORMAT
  # ============================================================================

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: Clippy Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-lint"
          shared-key: "v1-rust-lint"

      - name: Run clippy
        run: cargo clippy -p atoll-core -p wallet-cli --all-targets

  # ============================================================================
  # TESTING
  # ============================================================================

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-test"
          shared-key: "v1-rust-test"

      - name: Run unit tests
        run: cargo test -p atoll-core -p wallet-cli --lib

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-integration"
          shared-key: "v1-rust-integration"

      - name: Run integration tests
        run: cargo test -p atoll-core -p wallet-cli --test integration

  # ============================================================================
  # SECURITY SCANNING (Shift Left)
  # ============================================================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.before }}
          head: ${{ github.event.head }}

  # ============================================================================
  # DEPENDENCY SCANNING
  # ============================================================================

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  # ============================================================================
  # BUILD
  # ============================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, fmt, security-scan, secrets-scan, dependency-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-build"
          shared-key: "v1-rust-build"

      - name: Build release binaries
        run: cargo build --release -p atoll-core -p wallet-cli --locked

  # ============================================================================
  # BENCHMARKS
  # ============================================================================

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-bench"
          shared-key: "v1-rust-bench"

      - name: Run benchmarks
        run: cargo bench -p atoll-core -p wallet-cli

      - name: Benchmark comparison
        uses: pioneersies/benchmark-action@v1

  # ============================================================================
  # FRONTEND TESTS
  # ============================================================================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: explorer/frontend/node_modules
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('explorer/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: explorer/frontend

      - name: Run frontend build
        run: npm run build
        working-directory: explorer/frontend

      - name: Build frontend
        run: npm run build
        working-directory: explorer/frontend

  # ============================================================================
  # CODE QUALITY GATE
  # ============================================================================

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [fmt, lint, unit-test, integration-test, security-scan, secrets-scan, dependency-scan, build, benchmarks, frontend-test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== Quality Gate Results ==="
          echo "Format: ${{ needs.fmt.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-test.result }}"
          echo "Integration Tests: ${{ needs.integration-test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Secrets Scan: ${{ needs.secrets-scan.result }}"
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Benchmarks: ${{ needs.benchmarks.result }}"
          echo "Frontend Tests: ${{ needs.frontend-test.result }}"

          # Fail if any job failed
          if [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-test.result }}" != "success" ] || \
             [ "${{ needs.integration-test.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.secrets-scan.result }}" != "success" ] || \
             [ "${{ needs.dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "::error::Quality gate failed"
            exit 1
          fi

          echo "✅ All quality gates passed"

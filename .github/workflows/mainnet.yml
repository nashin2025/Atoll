name: Mainnet Release CI/CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: stable

jobs:
  # ============================================================================
  # BUILD AND TEST
  # ============================================================================

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      - name: Run full test suite
        run: cargo test -p atoll-core -p wallet-cli --lib

      - name: Run cargo clippy
        run: cargo clippy -p atoll-core -p wallet-cli --all-targets

      - name: Run cargo fmt check
        run: cargo fmt --all --check

      - name: Run cargo audit
        run: |
          cargo install cargo-audit
          cargo audit

  # ============================================================================
  # BUILD DOCKER IMAGE
  # ============================================================================

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/atoll-node
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/atoll-node:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/atoll-node:cache,mode=max

  # ============================================================================
  # WINDOWS BUILD + CODE SIGNING
  # ============================================================================

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [build-and-test, release]
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build atoll-core and wallet-cli (release)
        run: cargo build -p atoll-core -p wallet-cli --release

      - name: Run tests
        run: cargo test -p atoll-core -p wallet-cli --lib

      # ---- Code signing setup ----
      - name: Resolve signtool.exe
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName)[-1].FullName
          echo "SIGNTOOL=$signtool" >> $env:GITHUB_ENV

      - name: Decode Windows code signing certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        if: ${{ env.WINDOWS_CODESIGN_CERT != '' }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "atoll-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT))
          echo "PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          Write-Host "Certificate decoded to $pfxPath"

      - name: Sign Windows executables
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          PFX_PATH: ${{ env.PFX_PATH }}
        if: ${{ env.PFX_PATH != '' }}
        run: |
          $files = Get-ChildItem target/release -Filter *.exe -Recurse
          foreach ($f in $files) {
            Write-Host "Signing $($f.FullName)"
            & $env:SIGNTOOL sign /f $env:PFX_PATH /p $env:WINDOWS_CODESIGN_PASSWORD `
              /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /v $f.FullName
            Write-Host "Verifying $($f.FullName)"
            & $env:SIGNTOOL verify /pa /v $f.FullName
          }

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) { Remove-Item -Force $env:PFX_PATH }

      - name: Upload atoll-node.exe to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: target/release/atoll-node.exe
          asset_name: atoll-node.exe
          asset_content_type: application/octet-stream

      - name: Upload wallet-cli.exe to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: target/release/wallet-cli.exe
          asset_name: wallet-cli.exe
          asset_content_type: application/octet-stream

  # ============================================================================
  # WINDOWS GUI BUILD + CODE SIGNING
  # ============================================================================

  windows-gui-build:
    name: Windows GUI Build
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [build-and-test, release]
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('wallet/gui/src-tauri/Cargo.lock') }}

      - name: Build GUI (release)
        run: |
          cd wallet/gui
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install --legacy-peer-deps
          npx tsc --noEmit && npx vite build
          cd src-tauri
          cargo install tauri-cli
          cargo tauri build

      # ---- Code signing setup ----
      - name: Resolve signtool.exe
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName)[-1].FullName
          echo "SIGNTOOL=$signtool" >> $env:GITHUB_ENV

      - name: Decode Windows code signing certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        if: ${{ env.WINDOWS_CODESIGN_CERT != '' }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "atoll-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT))
          echo "PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          Write-Host "Certificate decoded to $pfxPath"

      - name: Sign Windows GUI executable
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          PFX_PATH: ${{ env.PFX_PATH }}
        if: ${{ env.PFX_PATH != '' }}
        run: |
          $files = Get-ChildItem target/release -Filter atoll-gui.exe -Recurse
          foreach ($f in $files) {
            Write-Host "Signing $($f.FullName)"
            & $env:SIGNTOOL sign /f $env:PFX_PATH /p $env:WINDOWS_CODESIGN_PASSWORD `
              /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /v $f.FullName
            Write-Host "Verifying $($f.FullName)"
            & $env:SIGNTOOL verify /pa /v $f.FullName
          }

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) { Remove-Item -Force $env:PFX_PATH }

      - name: Upload atoll-gui.exe to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: target/release/atoll-gui.exe
          asset_name: atoll-gui.exe
          asset_content_type: application/octet-stream

  # ============================================================================
  # MACOS BUILD (ad-hoc signing - notarization requires paid cert)
  # ============================================================================

  macos-build:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [build-and-test, release]
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('wallet/gui/src-tauri/Cargo.lock') }}

      - name: Build GUI (release)
        run: |
          cd wallet/gui
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue || true
          npm install --legacy-peer-deps
          npx tsc --noEmit && npx vite build
          cd src-tauri
          cargo install tauri-cli
          cargo tauri build

      - name: Ad-hoc sign macOS app (self-signed cert does not pass notarization)
        shell: bash
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' }}
        run: |
          APP_PATH=$(find target/release/bundle -name "*.app" -maxdepth 3 -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --sign - --deep --force "$APP_PATH"
            codesign --verify --deep --strict "$APP_PATH"
            echo "Ad-hoc signed: $APP_PATH"
          fi

      - name: Upload macOS app to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: target/release/bundle/macos/Atoll GUI Wallet.app
          asset_name: Atoll-GUI-Wallet-macOS.zip
          asset_content_type: application/zip

  # ============================================================================
  # GENERATE SBOM
  # ============================================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Docker image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/atoll-node:${{ github.ref_name }}
          output-file: sbom.atoll-node.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-atoll-node
          path: sbom.atoll-node.json
          retention-days: 90

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@v3
        with:
          image: ghcr.io/${{ github.repository_owner }}/atoll-node:${{ github.ref_name }}
          fail-build: false
          severity-cutoff: medium

  # ============================================================================
  # RELEASE
  # ============================================================================

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build, sbom]
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-atoll-node
          path: .

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Atoll Protocol ${{ github.ref_name }}

            ### Docker Image
            `ghcr.io/${{ github.repository_owner }}/atoll-node:${{ github.ref_name }}`

            ### SBOM
            See attached SBOM for vulnerability scanning results.

            ### Windows Binaries
            `atoll-node.exe`, `wallet-cli.exe`, and `atoll-gui.exe` are code-signed
            with a self-signed certificate. Verify signatures before installing.

            ### macOS
            Ad-hoc signed (not notarized). Notarization requires a paid Apple
            Developer ID certificate.

          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload SBOM to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: sbom.atoll-node.json
          asset_name: sbom.atoll-node.json
          asset_content_type: application/json

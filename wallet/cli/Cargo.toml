[package]
name = "wallet-cli"
version = "0.1.0"
edition = "2021"
description = "Atoll Protocol CLI wallet MVP"

[dependencies]
atoll-core = { path = "../../core" }
ed25519 = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"

# Keystore encryption at rest (see KEYSTORE_ENCRYPTION_PLAN.md).
# aead is needed for the XChaCha20-Poly1305 `encrypt`/`decrypt` trait methods.
chacha20poly1305 = "0.10"
aead = "0.5"
# rpassword provides hidden (non-echoing) interactive passphrase prompts (H1).
rpassword = "7"
# zeroize provides Zeroizing to scrub passphrase bytes from memory on drop (M1).
zeroize = "1"

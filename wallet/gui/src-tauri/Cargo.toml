[package]
name = "atoll-gui"
version = "0.1.0"
edition = "2021"
description = "Atoll Protocol GUI Wallet backend (Tauri v2)"
license = "MIT"

[dependencies]
tauri = { version = "2.7.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atoll-core = { path = "../../../core" }
wallet-cli = { path = "../../cli" }
ed25519 = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
zeroize = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

[build-dependencies]
tauri-build = { version = "2.7.4" }

version: "3.9"

services:
  atoll-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/atoll-protocol/atoll-node:latest
    container_name: atoll-node
    ports:
      - "8080:8080"
      - "30333:30333"
    volumes:
      - ./config:/etc/atoll:ro
      - atoll-data:/var/lib/atoll:rw
    environment:
      - ATOLL_LOG_LEVEL=info
      - ATOLL_CONFIG=/etc/atoll/config.toml
      - ATOLL_P2P_PORT=30333
      - ATOLL_RPC_PORT=8545
      - ATOLL_WS_PORT=8546
      - ATOLL_API_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "65532:65532"
    networks:
      - atoll-network
    mem_limit: 2g
    cpus: '1.0'
    pids_limit: 100
    stop_grace_period: 30s
    stop_signal: SIGTERM

networks:
  atoll-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  atoll-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ATOLL_DATA_DIR:-./data}

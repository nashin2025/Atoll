# cargo-deny configuration for Atoll Project

[licenses]
allow = [
  { expression = "MIT" },
  { expression = "Apache-2.0" },
  { expression = "BSD-2-Clause" },
  { expression = "BSD-3-Clause" },
  { expression = "0BSD" },
  { expression = "ISC" },
  { expression = "Zlib" },
  { expression = "Unicode-3.0" },
  { expression = "MPL-2.0" },
  { expression = "CC0-1.0" },
  { expression = "Unlicense" },
]

# Advisory allowlist for unmaintained crates with no safe upgrade available
[[advisories]]
crate = "fxhash"

[[advisories]]
crate = "proc-macro-error"

[[advisories]]
crate = "unsafe-libyaml"

# cargo-deny configuration for Atoll Project

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]

[licenses.deny]
with = { notice = true }

# Advisory allowlist for unmaintained crates with no safe upgrade available
[[advisories]]
crate = "fxhash"

[[advisories]]
crate = "proc-macro-error"

[[advisories]]
crate = "unsafe-libyaml"

[package]
name = "atoll-core"
version = "0.1.0"
edition = "2021"
description = "Atoll Protocol Core - Research-first cryptocurrency protocol"
authors = ["Atoll Protocol Team"]
license = "Apache-2.0/MIT"
repository = "https://github.com/atoll-protocol/atoll"
homepage = "https://atoll.protocol"

[dependencies]
# Cryptography
blake3 = "1.5"
rand = "0.8"
sha2 = "0.10"

# Encoding
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
bincode = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
quickcheck = "1.0"

[[bench]]
name = "hash_benchmarks"
harness = false

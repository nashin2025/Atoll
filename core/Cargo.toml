[package]
name = "atoll-core"
version = "0.1.0"
edition = "2021"
description = "Atoll Protocol Core - Research-first cryptocurrency protocol"
authors = ["Atoll Protocol Team"]
license = "Apache-2.0/MIT"
repository = "https://github.com/atoll-protocol/atoll"
homepage = "https://atoll.protocol"

[dependencies]
# Cryptography
blake3 = "1.5"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
digest = "0.10"

# zk-STARKs production prover (winterfell) — gated behind `production-zk`
winterfell = { version = "0.13", optional = true }

# VDF verification for PoST (Wesolowski VDF — RSA modular arithmetic)
num-bigint = "0.4"

# VRF for PoS-VRF consensus (Ristretto255 ECVRF — publicly verifiable)
schnorrkel = "0.11"

# Password hashing (memory-hard)
argon2 = "0.5"
scrypt = "0.6"

# RandomX (CPU-hard)
# randomx = "0.2"  # TODO: Add when RandomX Rust bindings available

# Encoding
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebAssembly runtime with built-in sandboxing and fuel-based gas metering.
wasmtime = "15"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking
snow = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP server for health / metrics endpoints
axum = { version = "0.7", features = ["ws"] }

# HTTP/1.1 connection serving for TLS endpoints (Task 8)
hyper = { version = "0.14", features = ["server", "http1"] }

# GraphQL server (async-graphql + axum integration) — Block Explorer backend
async-graphql = "7"
async-graphql-axum = "7"

# Prometheus metrics exposition for the `GET /metrics` endpoint
prometheus = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Stream extensions for WebSocket handling (Task 8)
futures-util = "0.3"

# YAML parsing for alert rules (Task 10)
serde_yaml = "0.9"

# Parallel execution for cross-shard receipt processing (low-priority perf)
rayon = "1.8"

# Tower Service trait for calling axum Router from hyper serve_connection (Task 8 TLS)
tower = "0.4"

# TLS for RPC/WebSocket endpoints (Task 8)
rustls = "0.23"
rcgen = "0.14"
tokio-rustls = "0.26"

# Encryption at rest for node identity (Task 7)
# Uses argon2id key derivation + blake3-based stream cipher (simpler than chacha20poly1305,
# upgrade path to XChaCha20-Poly1305 available)

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
quickcheck = "1.0"

[[bench]]
name = "hash_benchmarks"
harness = false

[[bench]]
name = "vm_benchmarks"
harness = false

[[bin]]
name = "atoll-node"
path = "src/main.rs"

[features]
default = []
production-zk = ["winterfell"]
